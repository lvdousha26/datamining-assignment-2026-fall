name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 单元测试 py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: 跑测试
        # 默认只跑快速集（pytest.ini 里 addopts = -m "not slow"）；
        # slow 契约测试需要 2.5 GB 面板，仓库不跟踪，fixture 会自动 skip
        run: python -m pytest -v

      - name: 导入冒烟
        run: |
          python -c "import sys; sys.path.insert(0, 'scripts'); import runlog, screen_stats, stack_ridge, event_study; print('scripts import ok')"

  title:
    name: PR 标题规范
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: 校验 Conventional Commits 格式与长度
        env:
          TITLE: ${{ github.event.pull_request.title }}
          LANG: C.UTF-8   # 让 ${#TITLE} 按字符计数，而不是按字节
        run: |
          echo "标题：$TITLE"
          if [[ ! "$TITLE" =~ ^(feat|fix|docs|ci|chore|refactor|test|perf|data)(\([a-z0-9-]+\))?:[[:space:]].+ ]]; then
            echo "::error::标题需形如 type(scope): 简述，type 取 feat/fix/docs/ci/chore/refactor/test/perf/data"
            exit 1
          fi
          if [[ "$TITLE" =~ [。.!！？?]$ ]]; then
            echo "::error::标题结尾不要带标点"
            exit 1
          fi
          if [ "${#TITLE}" -gt 72 ]; then
            echo "::error::标题 ${#TITLE} 字符，超过 72 上限"
            exit 1
          fi
          echo "标题格式 OK（${#TITLE} 字符）"

  release:
    name: 打 tag 发 Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 打包报告与图表
        run: |
          mkdir -p dist
          zip -r "dist/quant-reports-${GITHUB_REF_NAME}.zip" README.md requirements.txt requirements-ci.txt reports

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
