name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 单元测试 py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: 跑测试
        # 默认只跑快速集（pytest.ini 里 addopts = -m "not slow"）；
        # slow 契约测试需要 2.5 GB 面板，仓库不跟踪，fixture 会自动 skip
        run: python -m pytest -v

      - name: 导入冒烟
        run: |
          python -c "import sys; sys.path.insert(0, 'scripts'); import runlog, screen_stats, stack_ridge, event_study; print('scripts import ok')"

  release:
    name: 打 tag 发 Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 打包报告与图表
        run: |
          mkdir -p dist
          zip -r "dist/quant-reports-${GITHUB_REF_NAME}.zip" README.md requirements.txt requirements-ci.txt reports

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
